name: NFL night picks

# Locks Mingus Sports' NFL night-game picks (TNF, SNF, MNF, late-season Saturdays) and the Sunday 1 PM / 4 PM
# slates (picks/sun-early/, picks/sun-late/, one Sunday record) before kickoff, grades them after,
# and writes the weekly recap. Output goes to the `data` branch (picks/, odds/); scheduled Claude tasks email it to Josh.
# Reads Mingus Football's live site data (players, games, injuries) instead of rebuilding it.
# Every scheduled run is cheap: listing events is free, and props are pulled once per game (4 credits a night game,
# 2 a Sunday afternoon game).

on:
  schedule:
    # Thursday morning (Josh, Nov 3, 2026: lines and picks out earlier): TNF picks lock from 9 AM ET, every 30 min
    # 8:05-11:35 AM EST / 9:05 AM-12:35 PM EDT. Pulls landing before 10:37 AM show on NFL Lab's 10:37 AM run.
    - cron: "5,35 13-16 * * 4"
    # Saturday night: every Sunday game (1 PM, 4 PM, night) locks from 7 PM ET Saturday and one Sunday email is written
    # (picks/sunday/), every 30 min Sat 7:10-11:40 PM EST / 8:10 PM-12:40 AM EDT (Sunday 00-04 UTC).
    - cron: "10,40 0-4 * * 0"
    # Game-day afternoons Thu/Sat/Sun/Mon, every 30 min 3:15-6:45 PM EST: MNF and Saturday night games lock within
    # 4 hours of kickoff; on Sundays these also grade the 1 PM games from ESPN's box scores.
    # Thursday runs are a fallback if the morning runs were skipped. GitHub often starts scheduled runs late.
    - cron: "15,45 20-23 * * 0,1,4,6"
    # Sunday late morning, every 30 min 10:15 AM-2:45 PM EST: a fallback lock for any Sunday slate that couldn't lock
    # Saturday night.
    - cron: "15,45 15-19 * * 0"
    # Sunday night (Mon 00-05 UTC), every 15 min 7:05 PM-12:50 AM EST: grade the 4 PM and night games from ESPN's box
    # scores and write the one Sunday results email (picks/sunday/<day>-results.json) once the night game is final.
    # GitHub skips or delays scheduled runs on busy Sunday nights, so there are plenty of chances.
    - cron: "5,20,35,50 0-5 * * 1"
    # Grading, the morning after night games (Fri, Sun, Mon, Tue), once nflverse has the box scores: 4:30 / 7:30 /
    # 10:30 AM / 1:30 PM EST. The 7:30 run lands before the 8:41 AM results email (which also waits up to an hour).
    - cron: "30 9,12,15,18 * * 0,1,2,5"
  workflow_dispatch:
  # Also run when the picks code itself changes on main (e.g. right after merging), so a change can lock that night's
  # picks without waiting for the schedule. Commits to the `data` branch don't trigger this.
  push:
    branches: [main]
    paths: ["scripts/nfl_picks.py", ".github/workflows/nfl-picks.yml"]

permissions:
  contents: write

concurrency:
  group: data-branch        # shared with model-review.yml: both push to the data branch
  cancel-in-progress: false

jobs:
  picks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check out the data branch (created on the first run)
        env:
          REPO: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}
        run: |
          if git ls-remote --exit-code --heads "$REPO" data >/dev/null; then
            git clone -q --depth 1 --branch data "$REPO" store
          else
            mkdir store && git -C store init -q -b data && git -C store remote add origin "$REPO"
          fi
      - name: Model settings from Mingus Football
        # The projection model lives in Mingus Football (joshwilliams332/mingus); its weekly review tunes the settings
        # into that repo's data branch. Copy them in so the picks use the latest ones.
        run: |
          git clone -q --depth 1 --branch data --filter=blob:none --sparse https://github.com/joshwilliams332/mingus fantasy
          git -C fantasy sparse-checkout set model
          mkdir -p store/model
          [ -f fantasy/model/settings.json ] && cp fantasy/model/settings.json store/model/settings.json || true
      - name: Download the live site's data
        run: |
          mkdir -p livedata
          for f in meta players games teams; do
            curl -fsSL "https://joshwilliams332.github.io/mingus/data/$f.json" -o "livedata/$f.json"
          done
      - name: Lock, grade and recap
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python3 scripts/nfl_picks.py --data livedata --store store | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Save to the data branch
        run: |
          cd store
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nothing new"; exit 0; fi
          git commit -q -m "Picks update $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q origin data || (git pull -q --rebase origin data && git push -q origin data)
